<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Od promptu k produktu</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0E1F1A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Jeden vizuální svět: lesní zelená a zlatá. Matné sklo nad pevným podkladem se světelnými skvrnami.
   Layout: sloupec 1120 px; pořadí sekcí = pořadí příběhu (čísla, vývoj, princip, projekty, studie, postup, co dál). */
:root{
  color-scheme:dark;
  --bg:#0E1F1A; --ink:#F0F2EC; --soft:#B9CABF; --mute:#8FA89D;
  --gold:#D9B44A; --mint:#6FCF97;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.13); --hair:rgba(255,255,255,.08);
  --blur:blur(18px) saturate(140%);
  --sans:'IBM Plex Sans',Arial,sans-serif; --mono:'JetBrains Mono','Courier New',monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55;background-color:var(--bg);
  background-image:radial-gradient(900px 620px at 88% -8%,rgba(217,180,74,.22),transparent 62%),radial-gradient(820px 640px at -8% 34%,rgba(111,207,151,.16),transparent 62%),radial-gradient(900px 700px at 62% 108%,rgba(217,180,74,.12),transparent 62%);
  background-attachment:fixed}
a{color:var(--gold)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.glass{background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.06)}
header.top{position:sticky;top:0;z-index:5;background:rgba(14,31,26,.55);border-bottom:1px solid var(--hair);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
header.top .wrap{max-width:1400px}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;padding:10px 20px;min-height:64px}
.brand{font-family:var(--mono);font-weight:700;color:var(--gold);letter-spacing:1px;text-decoration:none;white-space:nowrap;flex:none}
nav{display:flex;gap:14px;flex-wrap:nowrap;align-items:flex-end;margin:0 auto;flex:none}
.ng{display:flex;flex-direction:column;gap:2px}
.ngl{font-family:var(--mono);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);padding-left:8px}
.ngi{display:flex;gap:2px}
nav a{display:flex;align-items:center;gap:6px;color:var(--soft);text-decoration:none;font-size:14.5px;padding:5px 7px;border-radius:8px;white-space:nowrap}
nav a svg,.kbtn svg,#music svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav a:hover,nav a.on{color:var(--ink);background:var(--glass-2)}
nav a.on svg{stroke:var(--gold)}
.tools{display:flex;gap:8px;align-items:center;flex:none;margin-left:auto}
.kbtn{display:flex;align-items:center;gap:8px;white-space:nowrap;border-radius:10px;padding:6px 10px;font-size:14px;color:var(--soft);background:var(--glass);border:1px solid var(--edge)}
.kbtn:hover{border-color:var(--gold);color:var(--ink)}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--edge);border-radius:6px;padding:1px 6px;color:var(--mute);background:rgba(0,0,0,.18)}
.seg{display:flex;border:1px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font-family:var(--mono);font-size:13px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--bg);font-weight:700}
.btn{border-radius:10px;padding:6px 12px;font-size:14px;background:var(--glass);border:1px solid var(--edge);white-space:nowrap}
#music{display:flex;align-items:center;gap:7px}
#music[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.btn:hover{border-color:var(--gold)}
#prog{height:2px;background:var(--gold);width:0}
section{padding:84px 0}
.eyebrow{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:3px;color:var(--gold);margin:0 0 14px}
h1{font-size:clamp(44px,8vw,104px);line-height:1.04;letter-spacing:-2px;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:clamp(30px,4.4vw,52px);line-height:1.12;letter-spacing:-.5px;margin:0 0 34px;font-weight:600;text-wrap:balance}
.lead{font-size:clamp(18px,2vw,22px);color:var(--soft);max-width:62ch;margin:0}
.hero{position:relative;padding:104px 0 92px;overflow:hidden}
.hero svg.curve{position:absolute;right:-40px;top:0;height:100%;width:auto;opacity:.9}
.hero .in{position:relative;display:flex;flex-direction:column;gap:22px}
.who{font-weight:600;font-size:22px;margin:22px 0 0}
.sm{font-family:var(--mono);font-size:13.5px;color:var(--mute);margin:4px 0 0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.n5{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}
.card.top{border-top:3px solid var(--gold)}
.card.hl{border-color:var(--gold);background:rgba(217,180,74,.10)}
.card.pick{cursor:pointer}
.num{font-family:var(--mono);font-weight:700;font-size:clamp(40px,5vw,60px);line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums;margin:0}
.n5 .num{font-size:clamp(34px,3.6vw,46px);white-space:nowrap}
.lab{font-weight:600;font-size:18px;margin:0}
.sub{font-size:14.5px;color:var(--mute);margin:0}
.tag{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:1.5px;color:var(--gold);margin:0}
.ttl{font-size:24px;font-weight:600;margin:0}
.txt{color:var(--soft);margin:0;font-size:17px}
.after{margin-top:30px}
details{margin-top:18px;border-top:1px solid var(--hair);padding-top:12px}
summary{cursor:pointer;font-family:var(--mono);font-size:13.5px;letter-spacing:1px;color:var(--mute);list-style:none;display:flex;align-items:center;gap:8px;width:max-content;max-width:100%}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";color:var(--gold);font-weight:700;width:14px;display:inline-block}
details[open]>summary::before{content:"−"}
summary:hover{color:var(--ink)}
details .txt,details .sm{margin-top:10px}
.chart{margin-top:30px;border-radius:18px;padding:22px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:end;height:190px;border-bottom:1px solid var(--edge)}
.barc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.bar2{width:min(84px,70%);background:rgba(255,255,255,.16);border-radius:8px 8px 0 0;min-height:3px;transition:background .25s}
.barc.on .bar2{background:var(--gold)}
.bval{font-family:var(--mono);font-size:15px;color:var(--soft)}
.barc.on .bval{color:var(--gold);font-weight:700}
.blab{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center;font-family:var(--mono);font-size:13.5px;color:var(--mute);padding-top:8px}
.cap{font-size:14px;color:var(--mute);margin:14px 0 0}
.band{padding:0}
.band .box{background:rgba(217,180,74,.92);color:var(--bg);border-radius:26px;padding:clamp(36px,6vw,72px);border:1px solid rgba(255,255,255,.35);box-shadow:0 24px 60px rgba(0,0,0,.3)}
.band .eyebrow,.band .lead{color:var(--bg)}
.st{font-size:clamp(46px,9vw,124px);font-weight:700;line-height:1.02;letter-spacing:-2px;margin:10px 0 26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 30px}
.chip{border-radius:999px;padding:7px 16px;color:var(--soft);background:var(--glass);border:1px solid var(--edge)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}
.group{margin-bottom:52px}
.case{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:30px;border-radius:22px;margin-bottom:22px}
.case h3{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0 0 14px;font-weight:600}
.case.rev .pic{order:-1}
.stat{display:flex;gap:18px;align-items:baseline;margin-top:10px}
.stat .num{font-size:38px;min-width:92px}
.stat .lab{font-weight:400;color:var(--ink);font-size:17px}
.pic{background:none;border:1px solid var(--edge);border-radius:14px;padding:0;overflow:hidden;display:block;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.3)}
.pic:hover{border-color:var(--gold)}
.pic img{display:block;width:100%;height:auto;max-width:100%}
.steps{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.pill{font-family:var(--mono);font-size:13.5px;border:1px solid var(--gold);border-radius:10px;padding:5px 10px;background:rgba(0,0,0,.18)}
.arr{color:var(--gold)}
.flow{display:grid;gap:12px;align-items:start;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.flow details{margin:0;border-top:0;padding:14px 18px;border-radius:14px}
.flow summary{color:var(--ink);font-size:14.5px;font-weight:700;width:100%}
.flow details.core{border-color:var(--gold);background:rgba(217,180,74,.10)}
.row{display:flex;gap:22px;align-items:baseline;padding:18px 0;border-top:1px solid var(--hair)}
.row .no{font-family:var(--mono);font-weight:700;color:var(--gold);font-size:24px;min-width:48px}
.row .t{font-size:clamp(20px,2.6vw,28px);font-weight:500}
.end{padding-bottom:110px}
.q{font-size:clamp(18px,2.2vw,24px);margin:8px 0 0}
.q span{color:var(--gold)}
dialog{border:1px solid var(--edge);border-radius:18px;background:rgba(14,31,26,.72);color:var(--ink);padding:14px;max-width:min(1200px,94vw);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(4,10,8,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#zoom img{display:block;max-width:100%;max-height:78vh;margin:0 auto 12px;border-radius:10px}
#cmd{width:min(620px,94vw);padding:0;margin-top:12vh}
#cmd h2{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:0;padding:14px 18px 0;font-weight:700}
#cmdq{width:100%;background:none;border:0;border-bottom:1px solid var(--hair);color:var(--ink);font:inherit;font-size:19px;padding:12px 18px 14px;outline:none}
#cmdq::placeholder{color:var(--mute)}
#cmdl{list-style:none;margin:0;padding:8px;max-height:min(52vh,420px);overflow-y:auto}
#cmdl li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:16.5px}
#cmdl li[aria-selected="true"]{background:rgba(217,180,74,.18);outline:1px solid rgba(217,180,74,.5)}
#cmdl li small{font-family:var(--mono);font-size:12px;color:var(--mute)}
#cmdl li.none{cursor:default;color:var(--mute)}
.pre{opacity:.6;transform:translateY(18px)}
.reveal{transition:opacity .6s ease,transform .6s ease}
@media (max-width:1239px){nav{display:none}}
@media (max-width:760px){.case{grid-template-columns:1fr;padding:22px}.case.rev .pic{order:0}.hero svg.curve{display:none}section{padding:56px 0}.kbtn span.kl{display:none}.kbtn kbd{display:none}#mlabel{display:none}.bar{gap:10px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal{transition:none}.pre{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="tools">

</div>

<div class="case glass" style="grid-template-columns:minmax(0,1fr)"><div><p class="eyebrow">${esc(g.eyebrow)}</p><h3>${esc(g.h2)}</h3><div class="grid">${g.cards.map(k=>`<div class="stat" style="flex-direction:column;gap:2px"><p class="num" data-n="${esc(k[0])}">${esc(k[0])}</p><p class="lab">${esc(k[1])}</p><p class="sub">${esc(k[2])}</p></div>`).join('')}</div>${more(u.more,`<p class="txt">${esc(g.lead)}</p><p class="sm"><a href="https://github.com/stetkaondrej/Struna">${esc(g.foot)}</a></p>`)}</div></div>
</div></section>
<section id="metoda"><div class="wrap"><p class="eyebrow">${esc(m.eyebrow)}</p><h2>${esc(m.h2)}</h2><p class="lead" style="margin:-14px 0 26px">${esc(m.lead)}</p><div class="flow">${m.cards.map((k,i)=>`<details class="glass${i===4||i===5?' core':''}"${i===4||i===5?' open':''}><summary>${esc(k[0])}</summary><p class="txt">${esc(k[1])}</p></details>`).join('')}</div></div></section>
<section id="dal"><div class="wrap"><p class="eyebrow">${esc(x.eyebrow)}</p><h2>${esc(x.h2)}</h2>${x.rows.map((r,i)=>`<div class="row"><span class="no">0${i+1}</span><span class="t">${esc(r)}</span></div>`).join('')}</div></section>
<section class="end" id="zacatek"><div class="wrap"><p class="eyebrow">${esc(z.eyebrow)}</p><h1>${esc(z.h1[0])}<br>${esc(z.h1[1])}</h1><p class="lead" style="margin-top:26px">${esc(z.lead[0])}<br>${esc(z.lead[1])}</p><div style="margin-top:22px">${z.items.map(k=>`<p class="q"><span>→</span> ${esc(k)}</p>`).join('')}</div><p class="who" style="margin-top:44px">${esc(z.name)}</p><p style="margin:4px 0 0"><a id="ln" href="https://www.linkedin.com/in/ondrej-stetka">${esc(z.link)}</a></p></div></section>`;
  acts=[{l:u.top,h:u.hint_nav,r:()=>go('uvod')}].concat(u.nav.map((nm,i)=>({l:u.go+': '+nm,h:u.hint_nav,r:()=>go(IDS[i])})),[
    {l:u.end,h:u.hint_nav,r:()=>go('zacatek')},
    {l:u.f_work,h:u.hint_act,r:()=>{filt='work';applyFilter();go('projekty');}},
    {l:u.f_personal,h:u.hint_act,r:()=>{filt='personal';applyFilter();go('projekty');}},
    {l:u.f_all,h:u.hint_act,r:()=>{filt='all';applyFilter();go('projekty');}},
    {l:lang==='cs'?u.to_en:u.to_cs,h:u.hint_act,r:()=>setLang(lang==='cs'?'en':'cs')},
    {l:playing?u.music_off:u.music_on,h:u.hint_act,r:()=>$('music').click()},
    {l:u.ln,h:u.hint_link,r:()=>{const a=$('ln');if(a)a.click();}}]);
  applyFilter(); setPhase(3); wire();
}
function setMusic(txt){$('mlabel').textContent=txt;$('music').setAttribute('aria-label',txt);}
function applyFilter(){
  document.querySelectorAll('.group').forEach(g=>{g.hidden=!(filt==='all'||g.dataset.g===filt);});
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===filt));
}
function setPhase(i){
  document.querySelectorAll('#phases .card').forEach(c=>c.classList.toggle('hl',+c.dataset.ph===i));
  document.querySelectorAll('.barc').forEach(b=>b.classList.toggle('on',PHASE_BARS[i].includes(+b.dataset.b)));
}
function fmt(v,src){const sep=src.includes(',')?',':(src.includes(' ')?' ':''); return sep?String(v).replace(/\B(?=(\d{3})+(?!\d))/g,sep):String(v);}
let io=null;
function wire(){
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;applyFilter();});
  document.querySelectorAll('#phases .card').forEach(c=>{const f=()=>setPhase(+c.dataset.ph);c.onclick=f;c.onmouseenter=f;c.onfocus=f;c.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();f();}};});
  document.querySelectorAll('.pic').forEach(b=>b.onclick=()=>{const dlg=$('zoom');$('zoomimg').src=b.dataset.src;$('zoomimg').alt=b.dataset.alt;if(dlg.showModal)dlg.showModal();});
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(io)io.disconnect();
  if(calm||!('IntersectionObserver' in window))return;
  io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const el=en.target;io.unobserve(el);
    if(el.dataset.n!==undefined){const src=el.dataset.n,end=parseInt(src.replace(/[^\d]/g,''),10);if(!end)return;const t0=performance.now(),dur=900;
      const tick=now=>{const k=Math.min(1,(now-t0)/dur);el.textContent=fmt(Math.round(end*(1-Math.pow(1-k,3))),src);if(k<1)requestAnimationFrame(tick);else el.textContent=src;};requestAnimationFrame(tick);}
    else el.classList.remove('pre');}),{threshold:.15});
  document.querySelectorAll('.num[data-n]').forEach(el=>io.observe(el));
  const vh=innerHeight;
  document.querySelectorAll('main section').forEach(sec=>{sec.classList.add('reveal');if(sec.getBoundingClientRect().top>vh*.9){sec.classList.add('pre');io.observe(sec);}});
}
function setLang(l){
  if(l===lang)return;
  /* zapamatuj si, kde čtenář je, a po překreslení ho vrať na stejné místo */
  let keep=null;
  for(const s of document.querySelectorAll('main section')){const r=s.getBoundingClientRect();if(r.bottom>90){keep={id:s.id,f:r.height?(90-r.top)/r.height:0};break;}}
  lang=l;try{localStorage.setItem('ptp-lang',l);}catch(e){}render();
  if(keep&&scrollY>0){const s=$(keep.id);if(s){s.classList.remove('pre');const r=s.getBoundingClientRect();const root=document.documentElement,old=root.style.scrollBehavior;root.style.scrollBehavior='auto';scrollTo(0,scrollY+r.top+keep.f*r.height-90);root.style.scrollBehavior=old;}}
}
function drawCmd(){
  const q=fold($('cmdq').value.trim()),u=DATA[lang].ui;
  shown=acts.filter(a=>!q||fold(a.l).includes(q)); if(sel>=shown.length)sel=0;
  $('cmdl').innerHTML=shown.length?shown.map((a,i)=>`<li role="option" id="co${i}" data-i="${i}" aria-selected="${i===sel}"><span>${esc(a.l)}</span><small>${esc(a.h)}</small></li>`).join(''):`<li class="none">${esc(u.cmd_none)}</li>`;
  $('cmdq').setAttribute('aria-activedescendant',shown.length?'co'+sel:'');
  const cur=$('co'+sel); if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
}
function openCmd(){const d=$('cmd');if(d.open||!d.showModal)return;$('cmdq').value='';sel=0;drawCmd();d.showModal();$('cmdq').focus();}
function runCmd(i){const a=shown[i];if(!a)return;$('cmd').close();a.r();}
$('kopen').onclick=openCmd;
$('cmdq').oninput=()=>{sel=0;drawCmd();};
$('cmdq').onkeydown=ev=>{if(ev.key==='ArrowDown'){ev.preventDefault();sel=Math.min(shown.length-1,sel+1);drawCmd();}else if(ev.key==='ArrowUp'){ev.preventDefault();sel=Math.max(0,sel-1);drawCmd();}else if(ev.key==='Enter'){ev.preventDefault();runCmd(sel);}};
$('cmdl').onclick=ev=>{const li=ev.target.closest('li[data-i]');if(li)runCmd(+li.dataset.i);};
$('cmdl').onmousemove=ev=>{const li=ev.target.closest('li[data-i]');if(li&&+li.dataset.i!==sel){sel=+li.dataset.i;drawCmd();}};
addEventListener('keydown',ev=>{if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();if($('cmd').open)$('cmd').close();else openCmd();}});
['zoom','cmd'].forEach(id=>$(id).addEventListener('click',ev=>{if(ev.target===$(id))$(id).close();}));
$('lang-cs').onclick=()=>setLang('cs'); $('lang-en').onclick=()=>setLang('en');
$('zoomclose').onclick=()=>$('zoom').close();
$('music').onclick=()=>{const a=$('bgm'),u=DATA[lang].ui,b=$('music');
  if(playing){a.pause();playing=false;setMusic(u.music_on);b.setAttribute('aria-pressed','false');return;}
  a.volume=.5;const pr=a.play();
  const ok=()=>{playing=true;setMusic(u.music_off);b.setAttribute('aria-pressed','true');};
  if(pr&&pr.then)pr.then(ok).catch(()=>{setMusic(u.music_err);});else ok();};
addEventListener('scroll',()=>{const h=document.documentElement;const k=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);$('prog').style.width=(k*100).toFixed(1)+'%';
  let cur='';IDS.forEach(id=>{const el=$(id);if(el&&el.getBoundingClientRect().top<150)cur=id;});
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+cur));},{passive:true});
render();
</script>
</body>
</html>
